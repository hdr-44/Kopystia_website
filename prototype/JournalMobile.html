<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopytsia — Journal, mobile</title>
<script>class DCLogic{constructor(){this.props={};this.state=null}setState(p){this.state=Object.assign({},this.state,p);this.__r&&this.__r()}forceUpdate(){this.__r&&this.__r()}}

class Component extends DCLogic {
renderVals() {
return {
posts: [
{cat:'Hat guides',title:'How to choose your hat size'},{cat:'Hutsul life',title:'[Story title]',bg:'url(img/hutsul-3.jpg) center / cover'},{cat:'Press',title:'[Publication] writes about Kopytsia'},
{cat:'Hat guides',title:'Caring for a felt hat'},{cat:'Hutsul life',title:'[Story title]',bg:'url(img/hutsul-5.jpg) center / cover'},{cat:'Hutsul life',title:'[Story title]',bg:'url(img/hutsul-7.jpg) center / cover'}
]
};
}
}

document.addEventListener('alpine:init',()=>Alpine.data('dc',()=>{const c=new Component();return{v:c.renderVals(),init(){c.__r=()=>{this.v=c.renderVals()}}}}))</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
<div x-data="dc">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
a{color:#264833;text-decoration:none}a:hover{color:#0F2A1B}
button{font:inherit}
</style>

<div style="width: 390px; min-height: 3000px; font-family: 'Manrope', system-ui, sans-serif; color: #1F2A22; background: #F7F2E8; font-size: 15px; line-height: 1.6">

</section>

<a href="ArticleMobile.html" style="display: flex; flex-direction: column; gap: 10px; padding: 0 24px 40px; color: #1F2A22">
<div style="aspect-ratio: 4 / 3; background: #B9AE92 url(img/hutsul-1.jpg) center / cover"></div>
<span style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #5E6B60">Featured · Hutsul life</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 34px; line-height: 1.05">[Featured article title]</span>
<span style="font-size: 13px; color: #5E6B60">[Date] · [N] min read</span>
</a>

<div role="tablist" aria-label="Categories" style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 24px; border-top: 1px solid #D6C6A6; border-bottom: 1px solid #D6C6A6">
<button type="button" role="tab" aria-selected="true" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #264833; background: #264833; color: #F7F2E8; font-size: 14px">All</button>
<button type="button" role="tab" aria-selected="false" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #264833; background: transparent; color: #264833; font-size: 14px">Hutsul life</button>
<button type="button" role="tab" aria-selected="false" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #264833; background: transparent; color: #264833; font-size: 14px">Hat guides</button>
<button type="button" role="tab" aria-selected="false" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #264833; background: transparent; color: #264833; font-size: 14px">Press</button>
</div>

<section style="padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 36px">
<template x-for="(p, $index) in v.posts"><div style="display: contents">
<a href="ArticleMobile.html" style="display: flex; flex-direction: column; gap: 8px; color: #1F2A22">
<div :style="`aspect-ratio: 3 / 2; background: #E6DAC2 ${p.bg}`"></div>
<span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E6B60"><span x-text="p.cat"></span></span>

</a>
</div></template>
