<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopytsia — Live try-on</title>
<script>class DCLogic{constructor(){this.props={};this.state=null}setState(p){this.state=Object.assign({},this.state,p);this.__r&&this.__r()}forceUpdate(){this.__r&&this.__r()}}

class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const SH = [
{name:'Fedora', rx:150, crown:'M120 188 C118 120 130 70 200 64 C270 70 282 120 280 188 Z'},
{name:'Pork pie', rx:135, crown:'M126 188 C126 150 130 118 200 116 C270 118 274 150 274 188 Z'},
{name:'Wide brim', rx:192, crown:'M128 188 C126 130 136 90 200 86 C264 90 274 130 272 188 Z'},
{name:'Traditional', rx:128, crown:'M124 188 C122 110 150 40 200 40 C250 40 278 110 276 188 Z'}
];
const CO = [{name:'Forest green',hex:'#264833'},{name:'Walnut',hex:'#8A6A45'},{name:'Charcoal',hex:'#2A2622'},{name:'Sand',hex:'#CDB98F'},{name:'Bordeaux',hex:'#6B2A2E'},{name:'Cream',hex:'#EDE3CF'}];
const BA = [{name:'Leather band',hex:'#5A3B24'},{name:'Woven Hutsul band',hex:'#B5412F'},{name:'Ribbon',hex:'#1F2A22'},{name:'No band',hex:'transparent'}];
const s = SH.find((x) => x.name === st.shape) || SH[0];
const c = CO.find((x) => x.name === st.colour) || CO[1];
const b = BA.find((x) => x.name === st.band) || BA[1];
const ring = (on) => (on ? '2px solid #264833' : '1px solid #D6C6A6');
return {
shapeName: s.name, colourName: c.name, bandName: b.name,
hex: c.hex, bandHex: b.hex, crown: s.crown, brimRx: s.rx,
shapes: SH.map((x) => ({ ...x, on: x === s, ring: ring(x === s), pick: () => this.setState({ shape: x.name }) })),
colours: CO.map((x) => ({ ...x, on: x === c, ring: ring(x === c), pick: () => this.setState({ colour: x.name }) })),
bands: BA.map((x) => ({ ...x, on: x === b, ring: ring(x === b), pick: () => this.setState({ band: x.name }) }))
};
}
}

document.addEventListener('alpine:init',()=>Alpine.data('dc',()=>{const c=new Component();return{v:c.renderVals(),init(){c.__r=()=>{this.v=c.renderVals()}}}}))</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
.m-burger{display:none;background:none;border:0;padding:10px;color:#264833;cursor:pointer}
@media (max-width:700px){
header[style]{padding:12px 20px!important;gap:8px!important}
.m-burger{display:block;margin-left:auto}
header>nav[aria-label="Main"]{display:none!important;order:9;width:100%;flex-direction:column;align-items:flex-start;gap:18px!important;padding:12px 0}
header.open>nav[aria-label="Main"]{display:flex!important}
header>div{order:8;width:100%}
[style*="max-width: 1280px"],[style*="padding: 0 40px"]{padding-left:20px!important;padding-right:20px!important}
[style*="padding: 120px"],[style*="padding: 96px"],[style*="padding: 80px"]{padding-top:56px!important;padding-bottom:56px!important}
[style*="minmax(340px"],[style*="minmax(280px"],[style*="minmax(240px"]{grid-template-columns:1fr!important}
[style*="gap: 64px"]{gap:32px!important}
[style^="display: flex; gap: 20px; padding: 24px 0"]{flex-wrap:wrap!important}
[style*="font-size: 64px"],[style*="font-size: 56px"]{font-size:40px!important}
[style*="font-size: 48px"],[style*="font-size: 44px"]{font-size:34px!important}
}
</style></head>
<body>
<div x-data="dc">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#264833;text-decoration:none}a:hover{color:#0F2A1B}
button{font:inherit}
</style>

<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: #1F2A22; background: #F7F2E8; font-size: 15px; line-height: 1.5">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; border-bottom: 1px solid #E3CCA4">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; letter-spacing: 0.18em; color: #264833">KOPYTSIA</span>
<div role="tablist" aria-label="View" style="display: flex; border: 1px solid #264833">
<a href="Main.html" role="tab" aria-selected="false" style="padding: 10px 20px; font-size: 13px">3D view</a>
<span role="tab" aria-selected="true" style="padding: 10px 20px; font-size: 13px; background: #264833; color: #F7F2E8">On me</span>
</div>
<a href="../Product.html" aria-label="Close" style="display: flex; padding: 12px; color: #264833"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<div style="flex: 1; display: flex; min-height: 0">

<section aria-label="Camera view" style="flex: 1; position: relative; background: #2B2E28; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
<svg width="620" height="700" viewBox="0 0 620 700" role="img" :aria-label="`Camera feed with the ${v.colourName} ${v.shapeName} placed on the head`">
<path d="M70 700 C90 560 200 520 310 520 C420 520 530 560 550 700 Z" fill="#4A4C43"></path>
<rect x="268" y="440" width="84" height="100" rx="30" fill="#5A5C52"></rect>
<ellipse cx="310" cy="340" rx="120" ry="150" fill="#6A6C61"></ellipse>
<g transform="translate(110 70) scale(1)">
<ellipse cx="200" cy="190" :rx="v.brimRx" ry="34" :fill="v.hex"></ellipse>
<path :d="v.crown" :fill="v.hex"></path>
<path d="M112 160 L288 160 L290 188 L110 188 Z" :fill="v.bandHex"></path>
<ellipse cx="200" cy="190" :rx="v.brimRx" ry="34" fill="none" stroke="#000000" stroke-opacity="0.2"></ellipse>
</g>
</svg>

<span style="position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(247,242,232,0.92); font-size: 13px; color: #1F2A22">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Camera stays on your device, nothing is uploaded</span>
<span style="position: absolute; top: 20px; right: 20px; padding: 8px 14px; background: rgba(247,242,232,0.92); font-size: 13px">Turn your head slowly to see the sides</span>

<div style="position: absolute; bottom: 28px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 24px">
<button type="button" aria-label="Upload a photo instead" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #E3CCA4; background: rgba(31,42,34,0.6); color: #F7F2E8; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1"></rect><path d="M4 16l5-5 4 4 3-3 4 4"></path></svg></button>
<a href="Result.html" aria-label="Take photo" style="width: 76px; height: 76px; border-radius: 50%; border: 4px solid #F7F2E8; display: flex; align-items: center; justify-content: center"><span style="width: 58px; height: 58px; border-radius: 50%; background: #F7F2E8"></span></a>
<button type="button" aria-label="Switch camera" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #E3CCA4; background: rgba(31,42,34,0.6); color: #F7F2E8; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"></path><path d="M20 5v4h-4M4 19v-4h4"></path></svg></button>
</div>
</section>

<aside aria-label="Options" style="width: 400px; border-left: 1px solid #E3CCA4; display: flex; flex-direction: column">
<div style="flex: 1; overflow: auto; padding: 28px; display: flex; flex-direction: column; gap: 28px">
<div>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 500; line-height: 1.05"><span x-text="v.shapeName"></span></h1>
<p style="margin: 4px 0 0; color: #4A5A4E"><span x-text="v.colourName"></span> · <span x-text="v.bandName"></span></p>
</div>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px">Shape</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<template x-for="(s, $index) in v.shapes"><div style="display: contents">
<button type="button" :aria-pressed="s.on" @click="s.pick()" :style="`min-height: 48px; background: #FFFFFF; cursor: pointer; font-size: 14px; border: ${s.ring}`"><span x-text="s.name"></span></button>
</div></template>
</div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px">Felt colour</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template x-for="(c, $index) in v.colours"><div style="display: contents">
<button type="button" :aria-label="c.name" :aria-pressed="c.on" @click="c.pick()" :style="`width: 46px; height: 46px; border-radius: 50%; padding: 4px; background: transparent; cursor: pointer; border: ${c.ring}`"><span :style="`display: block; width: 100%; height: 100%; border-radius: 50%; background: ${c.hex}`"></span></button>
</div></template>
</div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px">Band</legend>
<div style="display: flex; flex-direction: column; gap: 6px">
<template x-for="(b, $index) in v.bands"><div style="display: contents">
<button type="button" :aria-pressed="b.on" @click="b.pick()" :style="`min-height: 46px; padding: 0 12px; background: #FFFFFF; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; border: ${b.ring}`"><span :style="`width: 28px; height: 10px; background: ${b.hex}; border: 1px solid #D6C6A6`"></span><span x-text="b.name"></span></button>
</div></template>
</div>
</fieldset>
</div>
<div style="padding: 20px 28px 24px; border-top: 1px solid #E3CCA4">
<a href="Result.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; background: #264833; color: #F7F2E8; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase">Request this hat</a>
</div>
</aside>
</div>
</div>
</div>
</body>
</html>
